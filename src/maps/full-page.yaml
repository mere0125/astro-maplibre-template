# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/map.schema.json
type: map
id: temporary-forest-evidence

config:
  mapStyle: "/style.json"
  center: [-73.93, 40.70]
  zoom: 9.45

layers:
  # NYC-wide context. These are 24,213 nonempty polygons from the 24,663
  # records coded Vacant Land (LandUse 11) in PLUTO/MapPLUTO 26v2. They are context,
  # not parcels for which the historical or NDVI analysis has been completed.
  - id: citywide-vacant-land
    type: fill
    label: NYC vacant tax lots - context
    toggleable: false
    maxzoom: 12
    source:
      type: geojson
      url: "/data/assignment04/citywide.geojson"
    paint:
      fill-color: "#6f846a"
      fill-opacity: 0.68

  # The screen used in Assignments 2 and 3. Its rectangular edge is a method
  # boundary, not an official neighbourhood boundary.
  - id: field-study-window
    type: fill
    label: East New York field-study window
    toggleable: false
    source:
      type: geojson
      url: "/data/east_new_york_study_window.geojson"
    paint:
      fill-color: "#d9ab7d"
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 9, 0.14, 12, 0.05, 15, 0.02]
      fill-outline-color: "#aa7651"

  # At neighbourhood scale the 254 current vacant lots in the screening
  # window replace the citywide layer so their real parcel shapes stay clear.
  - id: screening-lots
    type: fill
    label: 254 lots screened in East New York
    toggleable: false
    minzoom: 11.5
    source:
      type: geojson
      url: "/data/assignment04/screening.geojson"
    paint:
      fill-color: "#c8d4c0"
      fill-opacity: 0.66
      fill-outline-color: "#91a18b"

  # Numeric stepped colour, taught in Interactive Mapping Part 3. Unlike the
  # earlier bubble view, colour stays inside each real parcel footprint.
  - id: vegetation-response
    type: fill
    label: 14 analysed lots - vegetation response
    toggleable: false
    minzoom: 11.5
    source:
      type: geojson
      url: "/data/temporary_forest_parcels.geojson"
    paint:
      fill-color: ["step", ["get", "veg_pct"], "#e7e1cf", 20, "#c9d6bb", 50, "#91aa7d", 80, "#4e7052"]
      fill-opacity: 0.86
    interactive:
      hover:
        cursor: pointer
      click:
        popup:
          - h3:
              - property: address
                else: Address not recorded
          - p:
              - str: "2022 pixels with NDVI above 0.20: "
              - property: veg_pct
              - str: "%"
          - p:
              - str: "Mean NDVI: "
              - property: ndvi_mean
          - p:
              - str: "Historical images: "
              - property: archive_evidence
          - p:
              - str: "Current status: "
              - property: current_record

  # Categorical colour, taught in Interactive Mapping Part 2. The outline
  # separates the two historical evidence groups without covering the NDVI
  # fill colours.
  - id: vacancy-history-outline
    type: line
    label: 14 analysed lots - vacancy history
    toggleable: false
    minzoom: 11.5
    source:
      type: geojson
      url: "/data/temporary_forest_parcels.geojson"
    paint:
      line-color: ["get", "duration_color"]
      line-opacity: 0.96
      line-width: ["interpolate", ["linear"], ["zoom"], 11.5, 1.2, 15, 2.8]

  # Optional tutorial comparison: the same numeric field controls circle size.
  # It remains off by default so the primary map is not buried under bubbles.
  - id: vegetation-size-comparison
    type: circle
    label: Show circles - size comparison
    visible: false
    minzoom: 11.5
    source:
      type: geojson
      url: "/data/temporary_forest_sites.geojson"
    paint:
      circle-color: "#526b4c"
      circle-opacity: 0.78
      circle-stroke-color: "#faf6eb"
      circle-stroke-width: 1.25
      circle-radius: ["step", ["get", "veg_pct"], 3, 20, 5, 50, 8, 80, 11]
    interactive:
      hover:
        cursor: pointer
      click:
        popup:
          - h3:
              - property: address
                else: Address not recorded
          - p:
              - str: "2022 pixels with NDVI above 0.20: "
              - property: veg_pct
              - str: "%"
          - p:
              - str: "Historical images: "
              - property: archive_evidence
